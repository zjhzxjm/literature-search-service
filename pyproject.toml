[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-search-service"
version = "0.1.0.dev0"
description = "PubMed ingestion and SciClaims-compatible literature retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["defusedxml==0.7.1"]

[project.optional-dependencies]
legacy-elasticsearch = ["elasticsearch>=8.13,<8.14"]
test = ["pytest>=8,<9", "elasticsearch>=8.13,<8.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires an explicitly configured disposable Elasticsearch instance"]
